name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # 15, not 5: with a warm setup-node cache the whole job finishes in ~2-3 min, but on
    # a cache miss `npm ci` alone takes ~5 min. That cancelled PRs #84 and #87 on
    # 2026-09-04, one second past the limit, on green code. The ceiling is a runaway
    # guard, not a performance budget.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # Pinned to 24 (current LTS): the fork story-suite (fork/test/*.test.ts) runs
          # under `node --test` with TypeScript type-stripping, which requires Node >= 23.
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests (story suite via node --test)
        run: npm test

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0

      - name: Run gitleaks
        # The CLI, not gitleaks/gitleaks-action: the action demands a license key
        # on organization-owned repositories, and this one moved to the
        # zeo-workspace organization on 2026-10-01, after which every run failed
        # with "missing gitleaks license". Same scanner, pinned by version and
        # sha256 instead of by action SHA. It scans the full history, which is
        # clean, rather than only the pull request's commits.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${tarball}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  osv-scan:
    name: SCA (OSV-Scanner, warn-first)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: OSV-Scanner (lockfile SCA)
        # Warn-first: continue-on-error keeps the pipeline green — enforcement is a
        # later, explicit decision (story 051 R1.2/R7.2). Plain action step, NOT the
        # reusable workflow (which forces SARIF upload + cannot be made non-blocking).
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=package-lock.json

  trufflehog:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history: trufflehog diffs base..head; shallow depth=1 scans nothing.
          fetch-depth: 0

      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          # The SHA above pins the composite wrapper, not the scanner. The wrapper ends
          # in `docker run "${IMAGE}:${VERSION}"` and `version` defaults to `latest`, so
          # without this line the thing that actually scans is a mutable tag reaching CI
          # without passing through any PR. Keep it equal to the version in the comment
          # above; trufflehog-pin.test.ts fails when the two diverge.
          version: "3.99.0"
          extra_args: --results=verified,unknown
