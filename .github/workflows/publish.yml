name: Release and Publish

on:
  push:
    branches:
      - main
  # Manual re-publish path: re-running an old run reuses that commit's workflow,
  # so a publish-auth fix can only be exercised via dispatch (or the next release).
  workflow_dispatch:

# Least privilege by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create release commit/tag
      pull-requests: write # open/maintain the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token, not GITHUB_TOKEN: GitHub holds every workflow run on a
      # PR opened by github-actions[bot] in action_required until a maintainer
      # approves it, so release PRs merged with no CI at all. A PR authored by an
      # App with write access runs its checks without that approval.
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # The publish job runs in the SAME workflow run via `needs`, so it never
      # depended on which token opened the PR.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          # NO release-type here. In v5's loadOrBuildManifest(), a non-empty
          # release-type takes the Manifest.fromConfig() branch, which builds the
          # config in memory and NEVER opens config-file — silently discarding
          # bump-minor-pre-major and changelog-sections. Only the empty-release-type
          # path reaches Manifest.fromManifest(), which reads the two files below.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing + provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # NO registry-url here: with it, setup-node writes an .npmrc
      # _authToken=${NODE_AUTH_TOKEN} line whose placeholder value makes npm
      # skip the OIDC trusted-publishing exchange (404/ENEEDAUTH instead of
      # publishing — github.com/orgs/community/discussions/176761).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # npm >= 11.5 is required for OIDC trusted publishing. Pinned (was npm@latest)
      # so the publish path has no floating toolchain (story 051 R4.1).
      - run: npm install -g npm@11.17.0
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public

  bundle-gentoo:
    name: Build and attach Gentoo bundle
    runs-on: ubuntu-latest
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write # upload the prebuilt bundle as a release asset
      id-token: write # keyless Cosign signing (OIDC) of the tarball + SBOM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # Build dist/ (needs devDeps), then reinstall production-only so the
      # bundle ships dist/ + a runtime node_modules with the native node-pty.
      - run: npm ci
      - run: npm run build
      - name: Production node_modules with native node-pty
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          # Compile the native addon explicitly and fail the job if it is absent,
          # so a broken bundle is never attached to the release.
          npm rebuild node-pty
          test -f node_modules/node-pty/build/Release/pty.node
      - name: Assemble deterministic tarball
        id: bundle
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          ver="${TAG_NAME#v}"
          pkg="claude-agent-tui-${ver}"
          mkdir "${pkg}"
          cp -r dist node_modules package.json LICENSE NOTICE README.md "${pkg}/"
          tar --sort=name --mtime='2020-01-01 00:00:00' \
              --owner=0 --group=0 --numeric-owner \
              -czf "${pkg}.tar.gz" "${pkg}"
          # Expose the package basename to later steps (SBOM, signing, upload).
          echo "pkg=${pkg}" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM (Syft) of the bundle
        # SPDX-JSON SBOM of the exact directory that became the tarball (dist +
        # production node_modules incl. native node-pty). Attached, not uploaded
        # as a workflow artifact — release asset upload is done explicitly below.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ steps.bundle.outputs.pkg }}
          format: spdx-json
          output-file: ${{ steps.bundle.outputs.pkg }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless-sign the tarball + SBOM (OIDC)
        # Keyless (Fulcio/Rekor) signing — needs id-token: write (granted above).
        # Cosign v4 deprecated --output-signature/--output-certificate and defaults
        # to the new bundle format; emit one self-contained .sigstore.json bundle
        # (signature + certificate + Rekor inclusion proof) per artifact via --bundle.
        env:
          PKG: ${{ steps.bundle.outputs.pkg }}
        run: |
          for f in "${PKG}.tar.gz" "${PKG}.sbom.spdx.json"; do
            cosign sign-blob --yes \
              --bundle "${f}.sigstore.json" \
              "${f}"
          done
      - name: Attach bundle + SBOM + signatures to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          PKG: ${{ steps.bundle.outputs.pkg }}
        run: |
          gh release upload "${TAG_NAME}" \
            "${PKG}.tar.gz" \
            "${PKG}.sbom.spdx.json" \
            "${PKG}.tar.gz.sigstore.json" \
            "${PKG}.sbom.spdx.json.sigstore.json" \
            --clobber
