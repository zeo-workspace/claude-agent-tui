name: Scorecard supply-chain security

# OpenSSF Scorecard — closes the last supply-chain gap flagged in the project
# report (§10/§11.3): SCA (OSV), secret scan (gitleaks/trufflehog), SBOM+Cosign
# and dependabot cooldown were already wired by story 051; Scorecard posture was
# the remainder. Public repo only (this mirror) — the private source-of-truth
# fork cannot run it for free.

on:
  branch_protection_rule:
  schedule:
    # Weekly, Monday 04:27 UTC (offset to avoid the top-of-hour runner rush).
    - cron: "27 4 * * 1"
  # No `push:` trigger, deliberately. Scorecard's SAST and CI-Tests checks score the
  # ratio of recent commits/PRs that carry a successful CodeQL or CI check run. Fired
  # on push, it races the very CI it measures: on 7d0422b it concluded at 01:24:25Z
  # while `Build` only finished at 01:27:32Z, so the two newest commits and their PR
  # were counted as unchecked (SAST 19/21, CI-Tests 12/13 -- alerts #8 and #15). The
  # same commit scores 10/10 once those checks settle. Schedule and dispatch only, so
  # the analysis always reads a settled history.
  workflow_dispatch:

permissions: read-all

concurrency:
  group: "scorecard-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload SARIF to the code-scanning dashboard
      id-token: write # publish_results to the public OpenSSF dashboard (OIDC)

    steps:
      - name: Checkout
        # Pinned by SHA — same pin as ci.yml / publish.yml.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results posts the score to the public OpenSSF dashboard (enables
          # the README badge). Set to false to keep results private to this repo.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
